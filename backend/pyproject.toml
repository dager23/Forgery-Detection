[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "docauth"
version = "2.0.0"
description = "DocAuth - multi-feature document and image forgery detection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "scipy>=1.12",
    "opencv-python-headless>=4.9",
    "scikit-image>=0.22",
    "pillow>=10.3",
    "pymupdf>=1.24.3",
    "exifread>=3.0",
    "reportlab>=4.1",
    "onnxruntime>=1.18",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
docauth = "docauth.cli:main"

[tool.setuptools.packages.find]
include = ["docauth*"]

[tool.setuptools.package-data]
"docauth.forensics.deep" = ["weights/*.onnx", "weights/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
