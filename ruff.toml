# Single lint/format config for backend/ and ml/ (keeps local runs and CI identical)
line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in argument defaults is idiomatic

[lint.isort]
known-first-party = ["docauth", "docauth_ml"]
